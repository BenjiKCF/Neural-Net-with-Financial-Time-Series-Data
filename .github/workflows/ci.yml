name: Modern Qlib workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e '.[dev,neural,visualization]'
      - name: Lint
        run: ruff check src tests
      - name: Test data, leakage boundaries, model, and workflow
        run: python -m pytest -q
      - name: Offline end-to-end demo
        run: fts demo --model all --epochs 1 --output runs/ci-demo
      - name: Durable paper execution and duplicate-run recovery
        run: |
          fts paper-replay --spec configs/paper_session_demo.json --output runs/ci-paper
          fts paper-replay --spec configs/paper_session_demo.json --output runs/ci-paper
      - name: Build and import the distributable wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python -m venv --system-site-packages /tmp/fts-wheel-check
          /tmp/fts-wheel-check/bin/python -m pip install --ignore-installed --no-deps dist/*.whl
          cd /tmp
          /tmp/fts-wheel-check/bin/python -c "import financial_ts; assert 'fts-wheel-check' in financial_ts.__file__; print(financial_ts.__version__)"
          /tmp/fts-wheel-check/bin/fts --help
      - name: Replay recorded historical backtest offline
        run: fts backtest --predictions reports/financial_research/predictions.csv --spy-csv reports/financial_research/spy_prices.csv --output runs/ci-backtest
      - name: Audit recorded ES and weight-edit experiment
        run: python scripts/audit_posttraining.py --evidence reports/paper_posttraining
      - name: Upload inspectable demo results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-check-python-${{ matrix.python-version }}
          path: |
            runs/ci-demo/comparison.json
            runs/ci-demo/*/metrics.json
            runs/ci-demo/*/run.json
            runs/ci-demo/*/predictions.csv
            runs/ci-demo/*/portfolio.csv
            runs/ci-demo/*/learning_curves.json
            runs/ci-paper/*.json
          if-no-files-found: ignore
