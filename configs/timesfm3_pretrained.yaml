# Requires separately downloaded official non-commercial research weights.
provider_uri: .data/qlib
region: us
instruments: all
output_dir: runs/timesfm3_pretrained
experiment_name: financial_ts
seed: 42
warmup_sessions: 60
segments: null
model:
  name: timesfm3_pretrained
  params:
    checkpoint_path: .data/timesfm3-checkpoint
    context_length: 256
    batch_size: 8
    device: cpu
    num_threads: 2
backtest:
  enabled: false
  topk: 5
  n_drop: 1
  account: 100000
  risk_degree: 0.95
  benchmark: null
  open_cost: 0.001
  close_cost: 0.001
  min_cost: 0.0
